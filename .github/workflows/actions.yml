name: CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu:22.04
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: '1.20'
      - uses: actions/checkout@v4
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
# These tests can run without a cluster.
  unit_and_integration:
    runs-on: ubuntu:22.04
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: '1.20'
      - uses: actions/checkout@v4
      - run: make unit
      - run: make integration
