name: CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu:22.04
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: '1.20'
      - uses: actions/checkout@v4
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
# These tests can run without a cluster.
  unit_and_integration:
    runs-on: ubuntu:22.04
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: '1.20'
      - name: Set Environment
        run: |
          echo "GOPATH=/home/runner/work/gpbackup/gpbackup/go" >> $GITHUB_ENV
          echo "/home/runner/work/gpbackup/gpbackup/go/bin" >> $GITHUB_PATH
      - uses: actions/checkout@v4
      - run: make unit
      - run: make integration
  acceptance_local:
    runs-on: ubuntu:22.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ci/new/Dockerfile
          load: true
          push: false
          tags: gpdb7_ggupgrade:latest
