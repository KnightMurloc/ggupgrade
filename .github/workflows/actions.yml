name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: '1.19'
          cache: false
      - uses: actions/checkout@v3
      - run: |
         sudo apt install protobuf-compiler-grpc
         make generate
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3

